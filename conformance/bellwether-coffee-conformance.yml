summary: >-
  Bellwether Coffee ships no public API, so the API-contract standards
  (OpenAPI, OAuth 2.0, OIDC, RFC 9457, AsyncAPI, MCP, A2A) are all
  not-applicable rather than failed. What it does conform to is the emerging
  web/agent discovery layer: RFC 9727 api-catalog, llms.txt, and Content
  Signals. Those three were fetched and verified on 2026-08-02.
standards:
- id: rfc9727-api-catalog
  conforms: true
  evidence: >-
    GET https://bellwethercoffee.com/.well-known/api-catalog returned 200 with
    Content-Type application/linkset+json and a valid linkset[] carrying an
    anchor plus service-desc and service-doc arrays.
- id: llms-txt
  conforms: true
  evidence: >-
    GET https://bellwethercoffee.com/llms.txt returned 200 text/plain, 44,007
