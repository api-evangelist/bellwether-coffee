aid: bellwether-coffee
name: Bellwether Coffee
description: 'Bellwether Coffee is a Berkeley, California coffee-technology company
  founded in 2013 by Ricardo Lopez that designs and manufactures an all-electric,
  ventless, automatic commercial coffee roaster. The Bellwether Shop Roaster (SCA
  Best New Product 2024) roasts 1.5 kg per batch on a standard 240V/30A circuit with
  no gas line, exhaust, or construction, and is paired with a complete coffee business
  program: a traceable Green Coffee Marketplace with ready-made roast profiles,
  cloud-connected roast automation and inventory software, custom retail packaging
  and labels, and ongoing service. Bellwether has raised roughly $92.7M across eight
  rounds and serves 500+ customers across 26 countries. It publishes no public
  developer API, but does maintain a genuine machine-readable web surface: an RFC
  9727 /.well-known/api-catalog linkset, a structured facts.json, an llms.txt, and
  Content Signals AI-usage declarations in robots.txt.'
